# The environment of the pipeline, exactly what the scripts import.
#
#   conda env create -f environment.yml
#   conda activate sdcpi-experiments
#
# The model checkers are NOT in here: Storm and PRISM are native tools,
# installed outside and pinned by version in the README. pip users take
# requirements.txt instead; the two files name the same packages.
name: sdcpi-experiments
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pyyaml          # every stage reads and writes the instance format
  - numpy           # the generator, and the impact modes of the benchmark
  - plotly          # the figures
  - python-kaleido  # plotly writes PDF through it
  - matplotlib      # joined by requirements.txt on 2026-08-28
