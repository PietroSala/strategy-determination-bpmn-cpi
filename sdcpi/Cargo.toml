[package]
name = "sdcpi"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "On-the-fly strategy synthesis for BPMN+CPI processes"

# No dependencies on purpose. The timings of this binary go into a paper, and a
# build that resolves nothing from the network is a build a reader can repeat
# years from now. Everything the search needs, the YAML reader of the fixed
# instance format, the seeded generator, the concurrent tables and the worker
# stacks, is written here.
[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[profile.bench]
inherits = "release"
